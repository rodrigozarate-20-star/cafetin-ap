<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetín - Realizar Pedido</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .grid { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .mesa, .producto-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: white; text-align: center; }
        .mesa { cursor: pointer; }
        .mesa.libre { background-color: #d4edda; }
        .mesa.reservada { background-color: #f8d7da; cursor: not-allowed; }
        .producto-card { min-width: 150px; }
        button { background-color: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>Cafetín Web - Realizar Pedido</h1>

    <h2>1. Selección de Mesa</h2>
    <input type="text" id="nombre-cliente" placeholder="Tu Nombre" style="padding: 8px; margin-bottom: 10px;"><br>
    <p><strong>Mesa elegida:</strong> <span id="mesa-elegida">Ninguna</span></p>
    <div id="mesas-container" class="grid"></div>

    <h2>2. Productos (Stock en tiempo real)</h2>
    <div id="productos-container" class="grid"></div>

    <h2>3. Tu Ticket de Consumo Total</h2>
    <div id="resumen-pedido"></div>
    <h3 id="total-consumo">Total: S/ 0.00</h3>

    <button onclick="confirmarPedido()" style="padding: 10px 20px; font-size: 16px;">Enviar Pedido al Cafetín</button>

    <script src="app.js"></script>
</body>
</html>
